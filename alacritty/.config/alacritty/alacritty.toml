[env]
SHELL = "/run/current-system/sw/bin/fish"

[terminal.shell]
program = "/run/current-system/sw/bin/fish"
args = ["--login", "--init-command", "tmux new-session -A -s main"]

[scrolling]
history = 0

[mouse]
hide_when_typing = true

[selection]
save_to_clipboard = true

# Replace alacritty's default URL hint, which is dropped once any hint is defined.
[[hints.enabled]]
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+"
hyperlinks = true
post_processing = true
mouse = { enabled = true, mods = "Command" }
command = { program = "/bin/sh", args = [
    "-c",
    "if command -v xdg-open >/dev/null; then xdg-open \"$0\"; else open \"$0\"; fi",
] }

# Open `path[:line[:col]]` references in nvim on click.
[[hints.enabled]]
regex = "(~|\\.\\.?)?(/[A-Za-z0-9_.@-]+)+(:[0-9]+){0,2}|[A-Za-z0-9_.@-]+(/[A-Za-z0-9_.@-]+)+(:[0-9]+){0,2}|[A-Za-z0-9_@-]+\\.[A-Za-z0-9]+:[0-9]+(:[0-9]+)?"
mouse = { enabled = true, mods = "Command" }
command = { program = "/bin/sh", args = ["-c", "exec ~/bin/edit-hint \"$0\""] }

[window]
decorations = "none"
startup_mode = "Maximized"

[font]
# normal = { family = "Iosevka Term", style = "Light" }
# bold = { style = "Semibold" }
# italic = { style = "Light Oblique" }
# normal = { family = "Less Perfect DOS VGA", style = "Regular" }
normal = { family = "PragmataPro Mono", style = "Regular" }
size = 16.0

[colors.primary]
background = "#000000"
foreground = "#b9b9b9"

[keyboard]
bindings = [
    { key = "T", mods = "Command", chars = "\u0001c" },    # tmux: new window
    { key = "W", mods = "Command", chars = "\u0001x" },    # tmux: close window
    { key = "Z", mods = "Command", chars = "\u0001z" },    # tmux: zoom window
    { key = "P", mods = "Command", chars = "\u0001w" },    # tmux: switch window
    { key = "S", mods = "Command", chars = "\u001B:w\n" }, # nvim: write buffer
    { key = "D", mods = "Command", chars = "darkmode\n" },
]
