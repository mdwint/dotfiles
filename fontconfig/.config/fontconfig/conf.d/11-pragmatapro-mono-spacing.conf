<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  PragmataPro Mono ships inconsistent spacing metadata: the Regular and
  Italic faces declare spacing=90 (dual) while Bold declares spacing=100
  (mono). Ghostty always adds spacing=mono to its fontconfig pattern
  (src/font/discovery.zig), so fontconfig sorted Bold first and every
  style slot resolved to the Bold face.

  Force all faces to mono so the style match decides the sort instead.
  This is a scan rule, so it needs `fc-cache -f` to take effect.
-->
<fontconfig>
  <match target="scan">
    <test name="family"><string>PragmataPro Mono</string></test>
    <edit name="spacing"><int>100</int></edit>
  </match>
</fontconfig>
